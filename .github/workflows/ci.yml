name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # sqllineage-python links against libpython at build time.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo test --workspace --all-features

  python:
    name: Python smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: "v1.9.4"
          args: >-
            --out dist
            --manifest-path sqllineage-python/Cargo.toml

      # Mirrors the smoke test in release.yml so a broken binding fails on the
      # pull request instead of on the release tag.
      - name: Smoke test
        run: |
          pip install dist/*.whl
          python -c "
          import sqllineage
          results = sqllineage.analyze('SELECT a FROM t')
          assert len(results) == 1
          assert len(results[0].tables.inputs) > 0
          print('OK:', results[0])
          "
